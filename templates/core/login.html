{% extends "base.html" %}

{% block title %}Bejelentkezés | Learning Portal{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h1 class="h4 mb-3 text-center">Bejelentkezés</h1>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Hibás felhasználónév vagy jelszó.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label">Felhasználónév</label>
                        <input
                            type="text"
                            name="username"
                            autofocus
                            autocapitalize="none"
                            autocomplete="username"
                            maxlength="150"
                            required
                            id="id_username"
                            class="form-control form-control-lg"
                        >
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label">Jelszó</label>
                        <input
                            type="password"
                            name="password"
                            autocomplete="current-password"
                            required
                            id="id_password"
                            class="form-control form-control-lg"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        Belépés
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
