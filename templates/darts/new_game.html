{% extends "base.html" %}

{% block title %}Új darts játék{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 720px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Új játék</h1>
        <a href="{% url 'darts:dashboard' %}" class="btn btn-outline-secondary">Vissza</a>
    </div>

    <form method="post" class="card shadow-sm">
        {% csrf_token %}
        <div class="card-body">
            <h2 class="h5 mb-3">Játékmód</h2>
            <div class="row g-2 mb-4">
                <div class="col-6">
                    <input class="btn-check" type="radio" name="game_type" id="game301" value="301" checked>
                    <label class="btn btn-outline-primary btn-lg w-100" for="game301">301</label>
                </div>
                <div class="col-6">
                    <input class="btn-check" type="radio" name="game_type" id="game501" value="501">
                    <label class="btn btn-outline-primary btn-lg w-100" for="game501">501</label>
                </div>
            </div>

            <h2 class="h5 mb-3">Kiszálló</h2>
            <div class="row g-2 mb-4">
                <div class="col-6">
                    <input class="btn-check" type="radio" name="checkout_mode" id="doubleOut" value="double" checked>
                    <label class="btn btn-outline-success w-100" for="doubleOut">Double out</label>
                </div>
                <div class="col-6">
                    <input class="btn-check" type="radio" name="checkout_mode" id="straightOut" value="straight">
                    <label class="btn btn-outline-success w-100" for="straightOut">Straight out</label>
                </div>
            </div>

            <h2 class="h5 mb-3">Játékosok</h2>
            <div class="list-group mb-4">
                {% for player in players %}
                    <label class="list-group-item d-flex gap-3 align-items-center py-3">
                        <input class="form-check-input flex-shrink-0" type="checkbox" name="players" value="{{ player.id }}">
                        <span class="fw-semibold">{{ player.name }}</span>
                    </label>
                {% empty %}
                    <div class="alert alert-warning mb-0">Előbb adj hozzá játékost a Darts főoldalon.</div>
                {% endfor %}
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-success btn-lg" {% if not players %}disabled{% endif %}>Játék indítása</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
